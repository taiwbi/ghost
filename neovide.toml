# Configuration for Neovide

# mkdir -p ~/.config/neovide
# ln -s ~/.config/nvim/config.toml ~/.config/neovide/config.toml

# --- Window frame ---
frame = "none"

# --- Fonts ---
[font]
size = 13
hinting = "full"
edging = "antialias"

[[font.normal]]
family = "Dank Mono"
style = "Bold"

[[font.bold]]
family = "Dank Mono"
style = "ExtraBold"

# fallback font
[[font.normal]]
family = "Vazir Code Hack"
